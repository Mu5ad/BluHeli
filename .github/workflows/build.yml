name: Build BluHeli (unsigned IPA para firmar con Feather)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: |
          xcodegen generate --spec BluHeli/project.yml --project BluHeli
          xcodebuild -list -project BluHeli/BluHeli.xcodeproj

      - name: Compilar App unsigned
        run: |
          set -o pipefail
          xcodebuild -project BluHeli/BluHeli.xcodeproj \
            -scheme BluHeli \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath BluHeli/build/BluHeli.xcarchive 2>&1 | tail -120

      - name: Empaquetar IPA
        run: |
          mkdir -p ipa/Payload
          cp -R BluHeli/build/BluHeli.xcarchive/Products/Applications/*.app ipa/Payload/
          cd ipa && zip -r ../BluHeli-unsigned.ipa Payload && cd ..
          ls -la BluHeli-unsigned.ipa

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BluHeli-unsigned-ipa
          path: BluHeli-unsigned.ipa
          if-no-files-found: error

      - name: Crear GitHub Release con la IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: "v4.${{ github.run_number }}"
          name: "BluHeli Pilot v13 (Build ${{ github.run_number }})"
          body: "Pilot v13: envio en hilo de enlace propio (sin huecos al redibujar la UI), bateria real desde la respuesta del heli, parada dura con bloqueo de 6 s, boton de luz, explicaciones en Diagnostico y Protocolo. Protocolo texto x+10 hex confirmado en vuelo."
          files: BluHeli-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
