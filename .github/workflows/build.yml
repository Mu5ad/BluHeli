name: Build BluHeli (unsigned IPA para firmar con Feather)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto + diagnosticar
        run: |
          xcodegen generate --spec BluHeli/project.yml --project BluHeli
          echo "== contenido de BluHeli/ =="
          ls -la BluHeli/
          echo "== contenido de BluHeli/BluHeli.xcodeproj =="
          ls -la BluHeli/BluHeli.xcodeproj/ || echo "NO EXISTE EL XCODEPROJ"
          echo "== validar pbxproj =="
          plutil -lint BluHeli/BluHeli.xcodeproj/project.pbxproj || true
          echo "== esquemas =="
          xcodebuild -list -project BluHeli/BluHeli.xcodeproj || true

      - name: Build unsigned (generic iOS device sin firma)
        run: |
          set -o pipefail
          xcodebuild -project BluHeli/BluHeli.xcodeproj \
            -scheme BluHeli \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath BluHeli/build/BluHeli.xcarchive 2>&1 | tail -40

      - name: Empaquetar IPA (Payload)
        run: |
          mkdir -p ipa/Payload
          cp -R BluHeli/build/BluHeli.xcarchive/Products/Applications/*.app ipa/Payload/
          cd ipa && zip -r ../BluHeli-unsigned.ipa Payload && cd ..
          ls -la BluHeli-unsigned.ipa

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BluHeli-unsigned-ipa
          path: BluHeli/BluHeli-unsigned.ipa
