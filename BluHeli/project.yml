name: BluHeli
options:
  bundleIdPrefix: com.silverlit
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  BluHeli:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.silverlit.blueskyheli
        CFBundleDisplayName: "Blu-Tech Heli"
        UISupportedExternalAccessoryProtocols:
          - com.issc.datapath
          - com.silverlit.datapath
          - com.silverlit.helicopter
          - com.silverlit.ferrari
          - com.silverlit.car
          - com.silverlit.blueskyheli
          - com.silverlit.btferrari
          - fi.wellmon.wECCAN
          - com.xpg.protocol
        UIBackgroundModes:
          - external-accessory
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Blu-Tech Heli usa Bluetooth para controlar tu helicóptero Silverlit."
        NSBluetoothPeripheralUsageDescription: "Blu-Tech Heli se comunica con el accesorio MFi del helicóptero."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        CODE_SIGNING_ALLOWED: "NO"
